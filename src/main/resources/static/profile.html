<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding-top: 50px; }
        .profile-card { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-save { background: #fc8019; color: white; border: none; }
        .btn-save:hover { background: #e67316; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-card">
        <h2 class="fw-bold mb-4 text-center">My Profile</h2>
        
        <div class="mb-3">
            <label class="form-label fw-bold">Full Name</label>
            <input type="text" id="profName" class="form-control" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Mobile Number</label>
            <input type="tel" id="profPhone" class="form-control" placeholder="Enter 10-digit number">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Delivery Address</label>
            <textarea id="profAddress" class="form-control" rows="3" placeholder="Enter your full address"></textarea>
        </div>

        <button class="btn btn-save w-100 fw-bold py-2 mb-2" onclick="saveProfile()">SAVE DETAILS</button>
        <button class="btn btn-outline-secondary w-100 fw-bold" onclick="location.href='home.html'">BACK TO MENU</button>
    </div>
</div>

<script>
    window.onload = function() {
        // Load existing data
        document.getElementById('profName').value = sessionStorage.getItem("userName") || "Guest";
        document.getElementById('profPhone').value = localStorage.getItem("userPhone") || "";
        document.getElementById('profAddress').value = localStorage.getItem("userAddress") || "";
    }

    function saveProfile() {
        const phone = document.getElementById('profPhone').value;
        const address = document.getElementById('profAddress').value;

        if(!phone || !address) {
            alert("Please fill in all details!");
            return;
        }

        localStorage.setItem("userPhone", phone);
        localStorage.setItem("userAddress", address);
        alert("Profile Updated Successfully!");
    }
</script>
</body>
</html>
