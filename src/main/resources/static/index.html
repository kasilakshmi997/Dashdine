<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Clone - Login & Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; }
        .auth-container { max-width: 450px; width: 100%; margin: auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn-swiggy { background-color: #fc8019; color: white; border: none; font-weight: bold; }
        .btn-swiggy:hover { background-color: #e67316; color: white; }
        .swiggy-logo { color: #fc8019; font-weight: 800; font-size: 2rem; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="auth-container">
        <div class="swiggy-logo">Dashdine</div>
        <h3 class="text-center mb-4" id="form-title">Login</h3>
        
        <div id="register-fields" style="display: none;">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="reg-name" class="form-control" placeholder="Enter your full name">
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" id="reg-address" class="form-control" placeholder="Delivery Address">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" id="auth-email" class="form-control" placeholder="name@example.com">
        </div>
        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" id="auth-pass" class="form-control" placeholder="Enter password">
        </div>

        <button class="btn btn-swiggy w-100 py-2 mb-3" id="main-btn" onclick="handleAuth()">Login</button>
        
        <p class="text-center mb-0">
            <a href="#" id="toggle-link" onclick="toggleForm()" class="text-decoration-none text-muted">New to Swiggy? Create an account</a>
        </p>
    </div>
</div>

<script>
    let isLogin = true;

    // Toggles between Login and Registration UI
    function toggleForm() {
        isLogin = !isLogin;
        document.getElementById('form-title').innerText = isLogin ? "Login" : "Create Account";
        document.getElementById('main-btn').innerText = isLogin ? "Login" : "Sign Up";
        document.getElementById('toggle-link').innerText = isLogin ? "New to Swiggy? Create an account" : "Already have an account? Login";
        document.getElementById('register-fields').style.display = isLogin ? "none" : "block";
    }

    // Handles Authentication logic with the Backend
    async function handleAuth() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-pass').value;

        if (isLogin) {
            // LOGIN logic: Send as x-www-form-urlencoded
            const params = new URLSearchParams();
            params.append('email', email);
            params.append('password', password);

            try {
                const response = await fetch('http://localhost:8080/api/users/login', {
                    method: 'POST',
                    body: params
                });

                if (response.ok) {
                    const user = await response.json();
                    if (user && user.fullName) {
                        // Store user session data
                        sessionStorage.setItem("userName", user.fullName);
                        sessionStorage.setItem("userEmail", user.email);
                        
                        alert("Login Successful! Welcome " + user.fullName);
                        window.location.href = "home.html"; // Redirect to the Home dashboard
                    }
                } else {
                    alert("Invalid Email or Password. Please try again.");
                }
            } catch (error) {
                console.error("Login Error:", error);
                alert("Server is not responding. Check if Spring Boot is running.");
            }
        } else {
            // REGISTER logic: Send as JSON
            const fullName = document.getElementById('reg-name').value;
            const address = document.getElementById('reg-address').value;

            try {
                const response = await fetch('http://localhost:8080/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password, address })
                });

                const result = await response.text();
                alert(result);
                if(result === "Registration successful!") {
                    toggleForm(); // Switch back to login after successful signup
                }
            } catch (error) {
                console.error("Registration Error:", error);
                alert("Failed to register. Check server console.");
            }
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
